<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 5 – Three.js Scene</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; }
      canvas { display: block; }
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        font-family: monospace;
        font-size: 13px;
        background: rgba(0,0,0,0.5);
        padding: 8px 12px;
        border-radius: 4px;
        pointer-events: none;
      }

      /* Score display — top center */
      #score {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-family: monospace;
        font-size: 22px;
        pointer-events: none;
      }

      /* Game over overlay — hidden until a collision occurs */
      #gameover {
        display: none;
        position: absolute;
        inset: 0; /* shorthand for top/right/bottom/left: 0 — fills the whole screen */
        background: rgba(0, 0, 0, 0.7);
        color: white;
        font-family: monospace;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }
      #gameover h1 {
        font-size: 64px;
        color: #ff3333;
        text-shadow: 0 0 20px #ff0000;
      }
      #gameover p {
        font-size: 24px;
      }
      #gameover button {
        padding: 12px 32px;
        font-size: 20px;
        font-family: monospace;
        background: #ff3333;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      #gameover button:hover {
        background: #ff6666;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <!-- Score counter — updated each frame by main.js -->
    <div id="score">Score: 0</div>

    <!-- Game over overlay — made visible by main.js on collision -->
    <div id="gameover">
      <h1>GAME OVER</h1>
      <p id="finalscore">Score: 0</p>
      <button onclick="location.reload()">Play Again</button>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
